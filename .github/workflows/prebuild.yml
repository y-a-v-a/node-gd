name: Prebuild

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:
  # Linux builds run in a container started with docker run instead of a job
  # container, because JavaScript actions don't run in Alpine containers on
  # arm64 runners (actions/runner#801).
  prebuild-linux:
    name: prebuild-linux (${{ matrix.target.libc }}, ${{ matrix.target.arch }}, ${{ matrix.node-version }})
    runs-on: ${{ matrix.target.runner }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        target:
          - { libc: glibc, arch: x64, runner: ubuntu-latest, image: bookworm }
          - { libc: glibc, arch: arm64, runner: ubuntu-26.04-arm, image: bookworm }
          - { libc: musl, arch: x64, runner: ubuntu-latest, image: alpine }
          - { libc: musl, arch: arm64, runner: ubuntu-26.04-arm, image: alpine }

    steps:
      - uses: actions/checkout@v4

      - name: Build, test and generate prebuilds
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            node:${{ matrix.node-version }}-${{ matrix.target.image }} \
            sh .github/scripts/build-linux.sh

      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-linux-${{ matrix.target.libc }}-${{ matrix.target.arch }}-${{ matrix.node-version }}
          path: prebuilds/
          retention-days: 30
          if-no-files-found: error

  test-package:
    name: test-package (${{ matrix.target.libc }}, ${{ matrix.target.arch }})
    needs: prebuild-linux
    runs-on: ${{ matrix.target.runner }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - { libc: glibc, arch: x64, runner: ubuntu-latest, image: 'node:24-bookworm-slim' }
          - { libc: glibc, arch: arm64, runner: ubuntu-26.04-arm, image: 'node:24-bookworm-slim' }
          - { libc: musl, arch: x64, runner: ubuntu-latest, image: 'node:24-alpine' }
          - { libc: musl, arch: arm64, runner: ubuntu-26.04-arm, image: 'node:24-alpine' }

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux prebuilds
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: prebuilds-linux-*
          merge-multiple: true

      - name: Install the package and load the prebuild
        run: |
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.target.image }} \
            sh .github/scripts/test-package.sh

  prebuild-macos:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            node-version: 22
            architecture: x64
          - os: macos-15-intel
            node-version: 24
            architecture: x64
          - os: macos-latest
            node-version: 22
            architecture: arm64
          - os: macos-latest
            node-version: 24
            architecture: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install system dependencies (macOS)
        run: |
          brew install pkg-config gd
          # Install optional dependencies for full feature set
          brew install libheif libavif libtiff webp fontconfig freetype

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          npm run rebuild
          npm test

      - name: Generate prebuilds
        run: |
          npx prebuildify --napi --strip

      - name: Re-sign prebuilds after strip
        run: |
          for file in prebuilds/*/node-gd.node; do
            codesign --force --sign - "$file"
            codesign --verify --verbose "$file"
          done

      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-macos-${{ matrix.node-version }}-${{ matrix.architecture }}
          path: prebuilds/
          retention-days: 30

      - name: Verify prebuild works
        env:
          PREBUILDS_ONLY: 1
        run: node .github/scripts/verify-prebuild.mjs .

  # Windows has no system libgd, so the Windows prebuilds link libgd and its
  # libraries statically from vcpkg and need nothing else at runtime.
  prebuild-windows:
    name: prebuild-windows (${{ matrix.target.arch }}, ${{ matrix.node-version }})
    runs-on: ${{ matrix.target.runner }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        target:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.target.arch }}

      - uses: ./.github/actions/libgd-windows
        with:
          arch: ${{ matrix.target.arch }}

      - name: Build and test
        run: npm ci && npm run rebuild && npm test

      - name: Generate prebuilds
        run: npx prebuildify --napi

      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-windows-${{ matrix.target.arch }}-${{ matrix.node-version }}
          path: prebuilds/
          retention-days: 30
          if-no-files-found: error

      - name: Verify prebuild works
        env:
          PREBUILDS_ONLY: 1
        run: node .github/scripts/verify-prebuild.mjs .

  test-package-windows:
    name: test-package-windows (${{ matrix.target.arch }})
    needs: prebuild-windows
    runs-on: ${{ matrix.target.runner }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.target.arch }}

      - name: Download Windows prebuilds
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: prebuilds-windows-*
          merge-multiple: true

      - name: Install the package and load the prebuild from its platform package
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File prebuilds | ForEach-Object FullName
          node .github/scripts/windows-packages.mjs prebuilds "$env:RUNNER_TEMP\platform-packages" tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack --pack-destination $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = New-Item -ItemType Directory "$env:RUNNER_TEMP\app"
          Set-Location $app
          npm init -y | Out-Null
          npm install (Get-Item "$env:RUNNER_TEMP\node-gd-[0-9]*.tgz").FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Name node_modules\@node-gd
          $other = if ('${{ matrix.target.arch }}' -eq 'x64') { 'arm64' } else { 'x64' }
          if (Test-Path "node_modules\@node-gd\win32-$other") { Write-Error "@node-gd/win32-$other is installed on ${{ matrix.target.arch }}"; exit 1 }
          if (Test-Path "node_modules\node-gd\prebuilds\win32-${{ matrix.target.arch }}") { Write-Error "The node-gd package contains a Windows prebuild"; exit 1 }
          node "$env:GITHUB_WORKSPACE\.github\scripts\verify-prebuild.mjs" "$app\node_modules\node-gd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:GITHUB_WORKSPACE\.github\scripts\avif-roundtrip.mjs" "$app\node_modules\node-gd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Job to collect all prebuilds and prepare for release
  collect-prebuilds:
    needs: [prebuild-linux, test-package, prebuild-macos, prebuild-windows, test-package-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Check npm version and release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing, 11.5.1 or newer is required`);
              process.exit(1);
            }
            const version = require("./package.json").version;
            if (process.argv[2] !== `v${version}`) {
              console.error(`Release tag ${process.argv[2]} does not match package.json version ${version}`);
              process.exit(1);
            }
          ' "$(npm -v)" "$TAG"

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: all-prebuilds
          pattern: prebuilds-*
          merge-multiple: true

      - name: Reorganize prebuilds
        run: |
          mkdir -p prebuilds
          # Keep the <platform>-<arch> directories node-gyp-build looks for,
          # Linux prebuild files carry the libc in their name
          cp -R all-prebuilds/. prebuilds/
          find prebuilds -type f
          for file in linux-x64/node-gd.glibc.node linux-x64/node-gd.musl.node \
            linux-arm64/node-gd.glibc.node linux-arm64/node-gd.musl.node \
            darwin-x64/node-gd.node darwin-arm64/node-gd.node \
            win32-x64/node-gd.node win32-arm64/node-gd.node; do
            if [ ! -f "prebuilds/$file" ]; then
              echo "Missing prebuild $file"
              exit 1
            fi
          done

      - name: Create release package
        run: |
          tar -czf prebuilds.tar.gz prebuilds/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: prebuilds.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Windows binaries are too large to include in node-gd for everyone, so
      # they are published as platform packages and added to node-gd as optional
      # dependencies. They must be on npm before node-gd.
      - name: Create Windows platform packages
        run: node .github/scripts/windows-packages.mjs prebuilds platform-packages

      - name: Publish Windows platform packages to npm
        run: |
          for dir in platform-packages/*/; do
            spec=$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
            else
              npm publish --access public "./$dir"
            fi
          done

      - name: Publish to npm (includes the macOS and Linux prebuilds)
        run: npm publish --access public
