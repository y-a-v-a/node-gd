name: run-tests
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}-bookworm
    strategy:
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }} sample
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install packages
        run: |
          apt-get update
          apt-get -y install build-essential pkg-config libgd-dev libheif-dev libavif-dev libaom-dev libdav1d-dev libx265-dev
      - name: Show libgd feature flags
        run: |
          gdlib-config --features || gdlib-config --all || true
      - name: Run npm tasks
        run: npm install && npm run test

  # Issue #104: building against the system libgd of Ubuntu 24.04 failed.
  # The HEIF file tests are left out: Ubuntu installs no HEVC codecs for libheif
  # by default, and with them libgd 2.3.3 crashes in libheif (libgd/libgd#788).
  # The TIFF reading tests are left out: libgd 2.3.3 reports a file size of 0 to
  # libtiff, which libtiff 4.5.1 rejects (fixed in libgd e66ea2b46b, not released).
  ubuntu-system-libgd:
    runs-on: ubuntu-24.04
    name: Ubuntu 24.04 system libgd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential pkg-config libgd-dev
      - name: Show detected libgd features
        run: |
          echo "libgd $(pkg-config --modversion gdlib): $(pkg-config --static --libs-only-l gdlib)"
          for feature in heif avif tiff webp jpeg png16 freetype fontconfig xpm; do
            echo "$feature: $(./util.sh $feature)"
          done
      - name: Build and test
        run: npm ci && npm run rebuild && npm test -- --grep "HEIF format tests|save it as heif|open a heif file|images TIFF|Handling TIFF files" --invert

  # Windows has no system libgd, so libgd and its libraries are built with vcpkg
  # as static libraries and linked into node-gd.node (issues #56 and #86).
  windows:
    runs-on: windows-latest
    name: Windows x64
    env:
      VCPKG_VERSION: '2026.10.16'
      VCPKG_PACKAGES: 'libgd[core,png,jpeg,tiff,webp,freetype,fontconfig,avif-aom]:x64-windows-static'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up vcpkg
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\vcpkg"
          git clone --quiet --depth 1 --branch $env:VCPKG_VERSION https://github.com/microsoft/vcpkg.git $root
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP\vcpkg-cache,readwrite" >> $env:GITHUB_ENV
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-${{ env.VCPKG_VERSION }}-${{ env.VCPKG_PACKAGES }}
      - name: Build libgd with vcpkg
        id: vcpkg-install
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install $env:VCPKG_PACKAGES --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-install.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-${{ env.VCPKG_VERSION }}-${{ env.VCPKG_PACKAGES }}
      - name: Show detected libgd features
        shell: pwsh
        run: |
          Get-Content "$env:VCPKG_ROOT\installed\x64-windows-static\lib\pkgconfig\gdlib.pc"
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows-static\lib\*.lib" | ForEach-Object Name
          node util-win.mjs x64 libraries
          foreach ($feature in 'heif','avif','tiff','webp','jpeg','png16','freetype','fontconfig','xpm') {
            "${feature}: $(node util-win.mjs x64 feature $feature)"
          }
      - name: Build and test
        run: npm ci && npm run rebuild && npm test
