name: run-tests
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}-bookworm
    strategy:
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }} sample
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install packages
        run: |
          apt-get update
          apt-get -y install build-essential pkg-config libgd-dev libheif-dev libavif-dev libaom-dev libdav1d-dev libx265-dev
      - name: Show libgd feature flags
        run: |
          gdlib-config --features || gdlib-config --all || true
      - name: Run npm tasks
        run: npm install && npm run test

  # Issue #104: building against the system libgd of Ubuntu 24.04 failed.
  # The HEIF file tests are left out: Ubuntu installs no HEVC codecs for libheif
  # by default, and with them libgd 2.3.3 crashes in libheif (libgd/libgd#788).
  ubuntu-system-libgd:
    runs-on: ubuntu-24.04
    name: Ubuntu 24.04 system libgd
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential pkg-config libgd-dev
      - name: Show detected libgd features
        run: |
          echo "libgd $(pkg-config --modversion gdlib): $(pkg-config --static --libs-only-l gdlib)"
          for feature in heif avif tiff webp jpeg png16 freetype fontconfig xpm; do
            echo "$feature: $(./util.sh $feature)"
          done
      - name: Debug TIFF
        run: |
          dpkg-query -W -f='${Package} ${Version}\n' libgd3 libtiff6 libtiff-dev
          npm ci && npm run rebuild
          node .github/scripts/debug-tiff.mjs
      - name: Build and test
        run: npm ci && npm run rebuild && npm test -- --grep "HEIF format tests|save it as heif|open a heif file" --invert
